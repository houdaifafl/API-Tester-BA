openapi: 3.0.3
info:
  title: APICraft API
  description: API documentation for APICraft backend services.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server
paths:
  /api/auth/signup:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - first_name
                - email
                - password
              properties:
                username:
                  type: string
                first_name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user_id:
                    type: integer
        '400':
          description: Bad request (e.g. username/email already exists)
        '429':
          $ref: '#/components/responses/429TooManyRequests'

  /api/auth/login:
    post:
      summary: Authenticate a user and get a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  username:
                    type: string
                  user_id:
                    type: integer
                  email:
                    type: string
                  default_workspace_id:
                    type: integer
        '401':
          description: Invalid username or password
        '429':
          $ref: '#/components/responses/429TooManyRequests'

  /api/auth/logout:
    post:
      summary: Log out the active user and clear the auth cookie
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logout successful"

  /api/auth/me:
    get:
      summary: Retrieve the current authenticated user's session profile
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Session profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    example: 123
                  username:
                    type: string
                    example: "alice"
                  email:
                    type: string
                    example: "alice@example.com"
                  is_admin:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/workspaces:
    get:
      summary: Retrieve all workspaces for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: A list of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/401Unauthorized'
    post:
      summary: Create a new workspace
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Workspace created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: Workspace name is required
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/workspaces/{workspace_id}:
    get:
      summary: Retrieve a single workspace
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Forbidden access to this workspace
        '404':
          description: Workspace not found
    delete:
      summary: Delete a workspace
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Workspace deleted
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Cannot delete default workspace
        '404':
          description: Workspace not found

  /api/workspaces/{workspace_id}/collections:
    get:
      summary: Get all collections in a workspace
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A list of collections
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Forbidden access to this workspace
        '404':
          description: Workspace not found
    post:
      summary: Create a collection in a workspace
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Collection created
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/workspaces/{workspace_id}/history:
    get:
      summary: Retrieve all history entries for the workspace (limit 100)
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A list of history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/History'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Forbidden access to this workspace history
        '404':
          description: Workspace not found
    post:
      summary: Create a new history entry
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
                - url
              properties:
                method:
                  type: string
                url:
                  type: string
                headers:
                  type: array
                  items:
                    type: object
                params:
                  type: array
                  items:
                    type: object
                body:
                  type: object
                auth:
                  type: object
      responses:
        '201':
          description: History entry created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
        '400':
          description: Validation error
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Forbidden access to this workspace history
        '404':
          description: Workspace not found

  /api/collections/{collection_id}:
    patch:
      summary: Rename a collection
      security:
        - BearerAuth: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Collection renamed
        '401':
          $ref: '#/components/responses/401Unauthorized'
    delete:
      summary: Delete a collection
      security:
        - BearerAuth: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Collection deleted
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/collections/{collection_id}/requests:
    post:
      summary: Create a request in a collection
      security:
        - BearerAuth: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Request created
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/requests/{request_id}:
    patch:
      summary: Update a request (rename, method, or save headers/params/body)
      security:
        - BearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                method:
                  type: string
                url:
                  type: string
                headers:
                  type: array
                  items:
                    type: object
                params:
                  type: array
                  items:
                    type: object
                body_type:
                  type: string
                body_raw:
                  type: string
      responses:
        '200':
          description: Request updated
        '401':
          $ref: '#/components/responses/401Unauthorized'
    delete:
      summary: Delete a request
      security:
        - BearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request deleted
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/execute:
    post:
      summary: Execute an HTTP request
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
                - method
              properties:
                url:
                  type: string
                method:
                  type: string
                headers:
                  type: array
                  items:
                    type: object
                body_type:
                  type: string
                body_raw:
                  type: string
      responses:
        '200':
          description: Request execution results
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/workspaces/{workspace_id}/invitations:
    post:
      summary: Send an invitation to another user
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                role:
                  type: string
                  enum: [editor, viewer]
                  default: viewer
      responses:
        '201':
          description: Invitation sent successfully
        '400':
          description: Invalid request or validation error (e.g. user already a member, pending invitation exists)
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Forbidden - not a member of the workspace
        '404':
          description: Workspace not found

  /api/invitations/pending:
    get:
      summary: Get all pending invitations for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/invitations/{invitation_id}/accept:
    post:
      summary: Accept a workspace invitation
      security:
        - BearerAuth: []
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invitation accepted successfully
        '400':
          description: Invitation is not pending
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Forbidden - invitation not for current user
        '404':
          description: Invitation not found

  /api/invitations/{invitation_id}/decline:
    post:
      summary: Decline a workspace invitation
      security:
        - BearerAuth: []
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invitation declined successfully
        '400':
          description: Invitation is not pending
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Forbidden - invitation not for current user
        '404':
          description: Invitation not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: token
  responses:
    401Unauthorized:
      description: Unauthorized - Token is missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Unauthorized: Token is missing or invalid"
    429TooManyRequests:
      description: Too Many Requests - Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Too Many Requests"
              message:
                type: string
                example: "10 per 1 minute"
  schemas:
    Workspace:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_default:
          type: boolean
        owner_id:
          type: integer

    History:
      type: object
      properties:
        id:
          type: integer
        workspace_id:
          type: integer
        method:
          type: string
        url:
          type: string
        params:
          type: array
          items:
            type: object
        headers:
          type: array
          items:
            type: object
        body:
          type: object
        auth:
          type: object
        status:
          type: integer
          nullable: true
        response_time:
          type: number
          nullable: true
        data:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time

    Invitation:
      type: object
      properties:
        id:
          type: integer
        workspace_id:
          type: integer
        workspace_name:
          type: string
        inviter_username:
          type: string
        inviter_email:
          type: string
        status:
          type: string
          example: pending
        role:
          type: string
          enum: [editor, viewer]
          example: viewer

  /api/workspaces/{workspace_id}/leave:
    delete:
      summary: Leave a workspace as a member (Editor or Viewer)
      tags: [Workspaces]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema:
            type: integer
          description: The ID of the workspace to leave
      responses:
        '200':
          description: Successfully left the workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: You have left the workspace.
        '401':
          description: Missing or invalid JWT token
        '403':
          description: Workspace owners cannot leave their own workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Owners cannot leave their own workspace
        '404':
          description: Membership not found (user is not a member of this workspace)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Membership not found

  /api/admin/users:
    get:
      summary: List all users on the platform
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of all users
        '403':
          description: Access denied for non-admins

  /api/admin/users/{user_id}/suspend:
    post:
      summary: Suspend a user account
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User suspended
        '403':
          description: Forbidden

  /api/admin/users/{user_id}/reactivate:
    post:
      summary: Reactivate a user account
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User reactivated
        '403':
          description: Forbidden

  /api/admin/users/{user_id}:
    delete:
      summary: Permanently delete a user
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User deleted
        '403':
          description: Forbidden

  /api/admin/users/{user_id}/promote:
    post:
      summary: Promote a user to Super Admin
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User promoted
        '403':
          description: Forbidden

  /api/admin/users/{user_id}/demote:
    post:
      summary: Demote a user from Super Admin
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User demoted
        '403':
          description: Forbidden

  /api/admin/workspaces:
    get:
      summary: List all workspaces
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of workspaces
        '403':
          description: Forbidden

  /api/admin/workspaces/{workspace_id}:
    delete:
      summary: Delete a workspace
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Workspace deleted
        '403':
          description: Forbidden

  /api/admin/workspaces/{workspace_id}/collections:
    get:
      summary: List collections and requests inside a workspace
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of collections and requests
        '403':
          description: Forbidden

  /api/admin/collections/{collection_id}:
    delete:
      summary: Delete a collection
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: collection_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Collection deleted
        '403':
          description: Forbidden

  /api/admin/workspaces/{workspace_id}/log-view:
    post:
      summary: Log a sensitive view of request configurations or history
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                details:
                  type: string
      responses:
        '200':
          description: Sensitive view logged
        '403':
          description: Forbidden

  /api/admin/audit-logs:
    get:
      summary: Fetch administrative audit logs
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of audit logs
        '403':
          description: Forbidden

  /api/notifications:
    get:
      summary: Fetch notifications for active user
      tags: [Notifications]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User notifications list

  /api/notifications/read:
    post:
      summary: Mark all active user's notifications as read
      tags: [Notifications]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notifications marked read

  /api/workspaces/{workspace_id}/comments:
    get:
      summary: Get workspace comments
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
        - name: request_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: A list of comments
        '401':
          description: Unauthorized
        '403':
          description: Access denied
        '404':
          description: Workspace not found
    post:
      summary: Post a comment or reply
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                parent_id:
                  type: integer
                request_id:
                  type: integer
                target_tab:
                  type: string
                target_key:
                  type: string
      responses:
        '201':
          description: Comment created
        '400':
          description: Invalid nesting or payload
        '401':
          description: Unauthorized
        '403':
          description: Access denied

  /api/comments/{comment_id}:
    patch:
      summary: Edit a comment
      security:
        - BearerAuth: []
      parameters:
        - name: comment_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
      responses:
        '200':
          description: Comment updated
        '401':
          description: Unauthorized
        '403':
          description: Unauthorized to edit
        '404':
          description: Not found
    delete:
      summary: Delete a comment
      security:
        - BearerAuth: []
      parameters:
        - name: comment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comment deleted
        '401':
          description: Unauthorized
        '403':
          description: Unauthorized to delete
        '404':
          description: Not found

  /api/workspaces/{workspace_id}/analytics:
    get:
      summary: Get workspace performance analytics
      description: Returns aggregated KPI metrics, time series, status distribution, slowest endpoints, and error hotspots for the workspace.
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: ["24h", "7d", "30d"]
            default: "24h"
      responses:
        '200':
          description: Aggregated analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  kpis:
                    type: object
                    properties:
                      avg_latency:
                        type: number
                      p90_latency:
                        type: number
                      p95_latency:
                        type: number
                      total_requests:
                        type: integer
                      error_rate:
                        type: number
                  time_series:
                    type: array
                    items:
                      type: object
                      properties:
                        bucket:
                          type: string
                        avg_latency:
                          type: number
                        count:
                          type: integer
                  status_distribution:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          type: string
                        count:
                          type: integer
                  slowest_endpoints:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        method:
                          type: string
                        avg_latency:
                          type: number
                        max_latency:
                          type: number
                  error_hotspots:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        method:
                          type: string
                        total_runs:
                          type: integer
                        failure_rate:
                          type: number
        '400':
          description: Invalid timeframe value
        '401':
          description: Unauthorized
        '403':
          description: Access denied
        '404':
          description: Workspace not found
